[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Proxy API calls to Netlify Functions if deployed serverless on Netlify
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Client-side routing fallback for SPA (Customer views & Kitchen display system)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
